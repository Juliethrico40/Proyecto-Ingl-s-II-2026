<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - Tus Quince</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Registro Para Fiesta De Quince Años</h1>
    </header>
    <nav>
        <a href="index.html">Volver al inicio</a>
    </nav>

    <section class="form-section">


        <form id="formRegistro" action="Historial.html">

            <label>Nombre completo:</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre completo" required>

            <label>Correo electrónico:</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo" required>

            <label>Edad:</label>
            <input type="number" id="edad" min="15" max="99" required>

            <label>Teléfono:</label>
            <input type="tel" id="telefono" placeholder="Ingresa tu número" required>

            <label> Fecha de nacimiento:</label>
            <input type="date" id="fecha Nacimiento" placeholder="Ingresa tu fecha de nacimiento" required>

            <label> Dirección:</label>
            <input type="text" id="direccion" placeholder="Ingresa tu dirección" required>

            <button type="submit">Enviar Registro</button>

            <a href="historial.html">
                <button type="button">Ver Historial de Registros</button>
            </a>




        </form>
    </section>





    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const formulario = document.getElementById("formRegistro");

            formulario.addEventListener("submit", function (e) {

                e.preventDefault();

                let nombre = document.getElementById("nombre").value;
                let correo = document.getElementById("correo").value;
                let telefono = document.getElementById("telefono").value;
                let direccion = document.getElementById("direccion").value;
                let fechaNacimiento = document.getElementById("fechaNacimiento").value;

                let hoy = new Date();
                let nacimiento = new Date(fechaNacimiento);

                let edad = hoy.getFullYear() - nacimiento.getFullYear();

                if (
                    hoy.getMonth() < nacimiento.getMonth() ||
                    (hoy.getMonth() === nacimiento.getMonth() && hoy.getDate() < nacimiento.getDate())
                ) {
                    edad--;
                }

                let tipo = edad >= 18 ? "Mayor de edad" : "Menor de edad";

                let registros = JSON.parse(localStorage.getItem("registros")) || [];

                registros.push({
                    nombre,
                    correo,
                    telefono,
                    direccion,
                    fechaNacimiento,
                    edad,
                    tipo
                });

                localStorage.setItem("registros", JSON.stringify(registros));

                alert("Registro guardado correctamente");

                formulario.reset();

            });

        });

    </script>





</body>

</html>
