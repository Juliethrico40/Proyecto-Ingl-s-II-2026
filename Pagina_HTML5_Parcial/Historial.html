<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Historial de Registros</title>
    <link rel="stylesheet" href="Css/Style.css">

</head>

<body>

    <h1>Historial de Registros</h1>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Edad</th>
                <th>Telefono</th>
                <th>Fecha De Nacimiento</th>
                <th>Direccion</th>
                <th>Tipo</th>
            </tr>
        </thead>

        <tbody id="tablaRegistros">

        </tbody>

    </table>

    <br>
    <div style="text-align:center;">
        <a href="index.html" class="btn-inicio">Volver al inicio</a>
    </div>

    <script>

        let registros = JSON.parse(localStorage.getItem("registros")) || [];

        let tabla = document.getElementById("tablaRegistros");

        registros.forEach((r, i) => {

            tabla.innerHTML += `
<tr>

<td>${i + 1}</td>
<td>${r.nombre}</td>
<td>${r.correo}</td>
<td>${r.edad}</td>
<td>${r.telefono}</td>
<td>${r.fechaNacimiento || ""}</td>
<td>${r.direccion || ""}</td>
<td>${r.tipo || ""}</td>
</tr>
`;

        });


    </script>

    <script src="script.js"></script>

</body>

</html>
